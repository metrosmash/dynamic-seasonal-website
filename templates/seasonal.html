<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seasonal redesign demo — Sample Café</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='seasonal.css') }}">
</head>
<body>
  <p class="poc-banner" role="note">{{ banner }}</p>

  <header class="demo-header">
    <div>
      <h1>Seasonal redesign demo</h1>
      <p class="demo-sub">A fictional <strong>Sample Café</strong> site, redesigned per season. All café content is placeholder text.</p>
    </div>
    <p><a class="back-link" href="{{ url_for('index') }}">Back to the decorator</a></p>
  </header>

  <main class="demo-main">
    <section class="controls" aria-label="Seasonal redesign controls">
      <h2>Choose a season</h2>
      <div class="preset-row" role="group" aria-label="Preset seasons">
        {% for preset in presets %}
        <button type="button" class="preset" data-season="{{ preset }}">{{ preset }}</button>
        {% endfor %}
      </div>

      <form id="custom-form" class="custom-row">
        <label for="custom-season">Enter your own season</label>
        <input id="custom-season" name="season" type="text" maxlength="80"
               placeholder="e.g. Cherry Blossom Festival" autocomplete="off">
        <button type="submit">Apply</button>
      </form>

      <div class="action-row">
        <button type="button" id="reset-button" class="danger">Reset to original</button>
        <button type="button" id="back-button">Back</button>
        <button type="button" id="forward-button">Forward</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <p id="history-line" class="history-line"></p>
    </section>

    <section aria-label="Seasonal site preview">
      <h2 class="preview-heading">Sample Café preview</h2>
      <iframe id="preview" class="preview" title="Seasonal Sample Café preview"
              src="{{ url_for('seasonal_preview') }}" sandbox="allow-scripts allow-forms"></iframe>
    </section>
  </main>

  <script id="seasonal-state" type="application/json">{{ state | tojson }}</script>
  <script src="{{ url_for('static', filename='seasonal.js') }}"></script>
</body>
</html>
